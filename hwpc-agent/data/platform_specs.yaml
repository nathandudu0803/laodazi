# 平台参数表(B 维护)
# 用途:platform_rules.py 读取本文件生成 PlatformPlan;prompts/03_platform.md 引用同一套参数。
#
# 来源与取舍:
#   - 图片数量、必含要素:以《赛题手册》第三节"平台场景"为准(评分依据)。
#   - 结构、节奏、禁忌:参考 P6-营销素材库/02-平台模板 的创作指南,只学结构,不抄正文。
#   - 冲突处理:P6 指南写小红书 6-10 张图、朋友圈 3-5 张图,与手册的 3-6 张、1-3 张不一致,
#     一律按手册。
#
# 判断标准(手册):更换平台后,结构、语气、图片数量、行动引导必须同时改变。
# 只改篇幅或平台名称,不算完成平台适配。

version: 2
updated: 2026-10-18

# 平台键与 A 的契约对齐:TaskInput.platform 取值为 公众号 / 小红书 / 朋友圈 / 海报,
# pipeline.PLATFORM_IMAGE_RANGE 也用这四个名字。下面的别名只用于容错,统一归一到这四个键。
aliases:
  公众号: [公众号, 微信公众号, 微信, gongzhonghao, wechat]
  小红书: [小红书, xiaohongshu, xhs, 红书]
  朋友圈: [朋友圈, 门店朋友圈, 微信朋友圈, moments]
  海报: [海报, 门店海报, 门店长图, 长图, poster]

global_rules:
  # 所有平台共用,不允许被某个平台覆盖
  - 产品事实只能来自传入的事实点,不得补充参数、卖点、价格。
  - 图片只能从传入的图片清单选,必须与正文型号一致。
  - 不写第一人称使用体验、用户评价、销量、库存、奖项。
  - 数值保留限定词:约、最高、最长、仅限某版本、起。
  - 动态信息(价格、券、补贴、赠品、分期)没有依据不写;有依据时带日期并分行写。
  - 结尾带一句版本免责,措辞按平台调整,不得省略。

platforms:
  公众号:
    name: 微信公众号
    reader_action: 连续阅读、收藏、转发
    one_line: 把一个问题讲透,读者读完愿意去核对或咨询
    images:
      min: 2
      max: 4
      placement: 每 400 到 600 字一张,必须推动叙事,不做装饰
      rule: 每张图都要写来源、图片说明和插入位置
    title:
      options: 3
      length: 14-26
      style: 一个矛盾或一个结果,可以带场景人物
      avoid: [感叹号堆叠, 震撼, 颠覆, 重新定义, 全能, 旗舰级形容词]
    length:
      body_chars: 1200-2000
      lead_chars: 80-150
      sections: 3-5
    structure:
      - name: 标题
        job: 只承载一个矛盾或一个结果
      - name: 导语
        job: 80 到 150 字还原人物、时间、任务和卡点
      - name: 正文章节
        job: 每章按"卡点、动作、证据、限制"写,先写用户动作,再出现功能名
        count: 3-5
      - name: 版本与边界
        job: 说明配置、系统、版本差异,以及这篇不解决什么
      - name: 结尾行动
        job: 只给一个动作
    tone: 叙事型、克制、有逻辑推进;允许有场景描写,但不得编造用户经历
    cta:
      count: 1
      style: 查官方规格页、预约体验或到店核对,单一动作
      ok: ["到店前先带上你常用的软件清单,我们现场逐项核对。"]
      bad: ["限时抢购", "错过再等一年", "马上下单"]
    tags:
      needed: false
    disclaimer: 不同销售版本配置可能不同,请以华为官方规格页及实际销售 SKU 为准。
    differs_from_others:
      - 唯一允许长篇叙事和分章节论证的平台
      - 图片少而精,服务于论证

  小红书:
    name: 小红书
    reader_action: 快速翻页、收藏、评论
    one_line: 一张卡一个结论,让人能收藏、照着做或提问
    images:
      min: 3
      max: 6
      placement: 封面一张,其余每张对应一个小结论
      rule: 每张图配一句图上短句和图注;参数用角标,不盖住画面
    title:
      options: 3
      length: 12-20
      style: 口语化,点出人群加问题;可用一个数字
      avoid: [感叹号堆叠, 绝对化, 亲测, 无广告, 吹爆, 闭眼入]
    length:
      body_chars: 300-600
      sections: 4-6
    structure:
      - name: 封面承诺
        job: 一个结果或一个冲突,不夸大
      - name: 问题卡
        job: 交代谁、在什么情境、卡在哪
      - name: 证据卡
        job: 每张只讲一个事实及其适用条件
        count: 2-3
      - name: 适合与不适合
        job: 主动写一个取舍,增强可信度
      - name: 核对卡
        job: 买前要核对的清单,并抛一个评论区问题
    tone: 口语化、短段落、第二人称或"如果你是…";可以轻松,但不得伪造亲身体验
    cta:
      count: 1
      style: 评论区提问或收藏后到店核对
      ok: ["你的专业需要哪些软件?评论区告诉我,我帮你对一下。"]
      bad: ["姐妹们冲", "手慢无", "私我拿价"]
    tags:
      needed: true
      count: 4-6
      note: 话题标签要与人群和场景相关,不蹭热点,不带价格词
    disclaimer: 配置因销售版本而异,以官方规格页和实际 SKU 为准。
    differs_from_others:
      - 卡片式分页,每页一个结论
      - 必须带话题标签
      - 禁止"亲测""我用了一个月"等第一人称体验,这是平台里最容易触线的点
      - 评论区提问是 CTA 的主要形式

  朋友圈:
    name: 门店朋友圈
    reader_action: 快速浏览、私聊
    one_line: 低打扰地点明一个人群和一个任务,引导私聊核对需求
    images:
      min: 1
      max: 3
      placement: 优先主图与场景图;顺序为场景、细节、证据
      rule: 同型号;不放客户聊天截图
    title:
      options: 0
      note: 朋友圈没有标题,首句承担标题作用
    length:
      body_chars: 80-180
      sections: 1-2
    structure:
      - name: 首句
        job: 点出人群和任务
      - name: 一个核心卖点
        job: 两三句写操作与证据,只讲一个卖点
      - name: 一个边界
        job: 主动说明一项限制
      - name: 邀请
        job: 请对方发来预算、常用软件或到店时间
    tone: 像真人沟通、短句、不端着;不超过一个 emoji 组
    cta:
      count: 1
      style: 私聊或到店体验
      ok: ["把你常用的软件发我,我按当前在售配置逐项核对。"]
      bad: ["最后三台", "全网最低", "懂的私聊", "永不卡"]
    tags:
      needed: false
    price_rule: 价格不稳定时写"以当前官方渠道核验为准",不使用内部价
    disclaimer: 具体配置以到店实机和官方页面为准。
    differs_from_others:
      - 无标题,字数最少
      - 只讲一个卖点,不展开论证
      - CTA 指向私聊或到店,而不是评论或阅读原文

  海报:
    name: 门店海报
    reader_action: 远距离扫读、到店核验
    one_line: 三秒内让顾客知道这是什么、适合谁、去哪问
    images:
      min: 1
      max: 1
      placement: 一张主视觉;不得拉伸、裁掉产品或错配型号
      rule: 主视觉型号必须与文案型号一致
    title:
      options: 3
      length: 8-16
      note: 主标题 8 到 16 字;副标题 12 到 22 字
    length:
      body_chars: 40-90
      sections: 1
      selling_points_max: 3
    structure:
      - name: 主标题
        job: 一句话定位
      - name: 副标题
        job: 补充适用人群或场景
      - name: 卖点
        job: 最多 3 条,每条一行,每条绑定一个事实
        count: 1-3
      - name: 活动说明
        job: 有依据才写;写明期限、范围和核验入口。没有依据整块省略
      - name: 到店动作
        job: 型号、版本提醒和咨询入口
    tone: 短、硬、可远读;不用长句和从句
    cta:
      count: 1
      style: 到店体验或扫码查看官方页面
      ok: ["到店实机体验,现场核对配置与版本。"]
      bad: ["限时特惠", "仅此一天", "全城最低"]
    tags:
      needed: false
    price_rule: 价格只放可实时更新模块;没有依据不放任何金额
    disclaimer: 脚注与主张同屏或紧邻,不把条件压到角落小字。
    differs_from_others:
      - 唯一只允许 1 张图
      - 卖点不超过 3 条
      - 文案最短,以可远读的短句为主
      - 活动说明没有依据时整块省略


