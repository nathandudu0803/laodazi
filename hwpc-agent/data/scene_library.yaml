# 场景库(B 维护)
# 用途:scene.py 读取本文件做场景匹配、追问和切入点选择;prompts/02_scene.md 引用同一套定义。
#
# 设计原则:
#   1. 本文件只写"关注哪类事实、怎么切入、哪些不能写",不写任何具体产品参数。
#      参数只能来自 A 传入的事实点,避免在这里埋下无来源的数字。
#   2. 判断标准(手册):更换场景后,内容切入点必须改变。
#      所以每个场景都有独立的 angle(切入点)和 fact_priority(事实优先级),不共用。
#   3. fact_priority 里的名称对应 产品事实.md 的二级标题:
#      屏幕、处理器、显卡、存储、内存、电池、接口、尺寸与重量、键盘和触控板、
#      摄像头、音频、无线连接、操作系统、特色应用、包装清单。
#   4. "卖点与限制.md" 的六个角度:型号身份、屏幕与显示、性能与存储、便携续航接口、
#      系统协同与兼容、适用人群与限制。选事实时先看"表达边界"。

version: 1
updated: 2026-10-18

# 购买阶段。scene.py 用它决定内容目标和 CTA 强度。
# 与 A 的契约对齐:SceneProfile.purchase_stage 只取 了解 / 比较 / 决策 / 已购。
# "到店"不是契约取值,所以并入"决策",用 visit_intent 标记保留差异。
# "已购"是读者已经买了设备,内容目标是使用与核对,不再做转化。
stages:
  了解:
    key: awareness
    goal: 让读者知道有这类选择,以及自己该先想清楚什么
    cta_strength: 最弱,引导收藏或提问
  比较:
    key: comparison
    goal: 帮读者建立判断顺序,把候选从多个缩到两三个
    cta_strength: 中,引导核对清单或预约体验
  决策:
    key: decision
    goal: 帮读者确认版本和配置,排除买错的风险
    cta_strength: 较强,引导到店实机验证
    visit_intent:
      goal: 让人愿意今天或本周去店里,带着任务去验证
      cta_strength: 强,但只给一个动作,不制造紧迫感
  已购:
    key: owned
    goal: 帮已购读者核对自己的版本,了解可用的功能与限制
    cta_strength: 弱,引导查官方支持入口,不做转化

scenes:
  back_to_school:
    name: 开学季
    audiences: [大学新生, 家长, 研究生, 高中毕业生]
    default_stage: 比较
    core_conflict: 预算有限,专业要求不明,要背着走四年
    angle: 先问专业要装什么软件,再谈背得动不动、接口够不够,性能放最后
    angle_variants:
      student: 以"课程软件清单"开场,写一天从宿舍到教室的动线
      parent: 以"这笔钱要用四年"开场,写容量余量、售后入口、版本别买错
    fact_priority: [操作系统, 尺寸与重量, 电池, 接口, 存储, 屏幕, 处理器]
    reader_questions:
      - 我的专业要装什么软件,这台能不能装
      - 每天要背多久,加上充电器多重
      - 教室投影和宿舍显示器接得上吗
    must_not:
      - 把所有学生需求归结为单一性能指标
      - 写"所有专业都能用""大学四年不卡"
      - 承诺固定续航小时数
      - 提学生优惠、教育优惠的具体数额(知识库没有数据)
    ask_if_missing: [专业或主要用途, 是否经常带出门, 必用软件]

  office:
    name: 职场办公
    audiences: [商务人士, 移动办公者, 行政人员, 中层管理者]
    default_stage: 比较
    core_conflict: 一天在工位、会议室、差旅三处切换,不能因为设备掉链子
    angle: 以一次完整的会议材料流转开场,写会前、会中、会后各自要什么
    angle_variants:
      commuter: 写差旅路上的 6 小时:登机前、候机、酒店
      manager: 写多任务并行:邮件、会议、文档同时开
    fact_priority: [尺寸与重量, 电池, 接口, 摄像头, 音频, 无线连接, 特色应用, 屏幕]
    reader_questions:
      - 出差带一台够不够,要不要另带转接器
      - 视频会议的摄像头和麦克风怎么样
      - 文件在手机、平板、电脑之间怎么流转
    must_not:
      - 虚构软件测试结果或会议体验
      - 写"效率翻倍"类没有测试方法的结果
      - 对未列出的企业安全策略做兼容承诺
    ask_if_missing: [是否经常出差, 常用办公软件, 是否有外接显示器需求]

  creator:
    name: 内容创作
    audiences: [设计师, 摄影师, 视频创作者, 自媒体]
    default_stage: 比较
    core_conflict: 屏幕、性能、素材流转三件事要同时成立,任何一环弱都会拖慢工作
    angle: 以"一个素材从拍摄到成片"的流程开场,每一步对应一项硬件条件
    angle_variants:
      designer: 写色彩与屏幕的版本区分,强调标准版与其他版本不能混
      video: 写素材容量、外接存储接口、导出时的散热边界
    fact_priority: [屏幕, 处理器, 显卡, 内存, 存储, 接口, 无线连接]
    reader_questions:
      - 屏幕色域是哪个版本的数据
      - 外接硬盘和读卡器接得上吗,速度会不会被接口限制
      - 剪视频或做渲染到底能不能撑住
    must_not:
      - 虚构软件跑分、渲染耗时、帧率
      - 把外观图当作性能证据
      - 把标准版色域套给其他版本
      - 说"专业级""影视级"这类没有证据的定级
    ask_if_missing: [创作类型, 常用软件, 素材规模]

  family_refresh:
    name: 家庭换新
    audiences: [家庭用户, 旧机换新用户, 给父母买电脑的人, 家长]
    default_stage: 决策
    core_conflict: 换机怕麻烦,旧数据怎么办,家里人谁用谁管
    angle: 以"旧电脑里那些东西怎么搬"开场,写迁移、上手难度、全家共用
    angle_variants:
      for_parents: 写操作简单、字够大、出问题找谁
      multi_user: 写一台电脑几个人用,账号与隐私怎么分
    fact_priority: [操作系统, 屏幕, 特色应用, 键盘和触控板, 接口, 存储, 包装清单]
    reader_questions:
      - 旧电脑里的文件怎么搬过来
      - 老人和孩子能不能用得顺
      - 出了问题去哪里查
    must_not:
      - 承诺知识库里没有的政策:以旧换新补贴、折抵价格、延保、免费上门
      - 写"傻瓜式""零门槛"
      - 保证数据迁移一定成功
    ask_if_missing: [谁来用, 旧设备系统与数据量, 是否需要保留旧软件]
    note: 以旧换新、国补等一律不写数额,只写"以官方渠道当期规则为准"并标待确认

  enterprise_procurement:
    name: 企业采购
    audiences: [中小企业主, 行政或IT负责人, 团队采购]
    default_stage: 决策
    core_conflict: 一批设备要统一、可管理、可售后,出错的代价比个人高
    angle: 以"一批人、一套标准"开场,写部署一致性、管理方式、服务入口
    angle_variants:
      small_team: 5 到 20 台,强调一次选对、版本统一
      it_manager: 强调系统版本、接口统一、与现有外设兼容
    fact_priority: [操作系统, 接口, 无线连接, 存储, 内存, 包装清单, 尺寸与重量]
    reader_questions:
      - 十几台要不要统一到同一个版本
      - 现有打印机、投影、扩展坞能不能接
      - 批量采购怎么走流程
    must_not:
      - 写批量折扣、项目价、返利(P4 全是空模板,没有数据)
      - 承诺交期与库存
      - 对企业安全策略、VPN、打印机做"全部兼容"
    ask_if_missing: [台数, 现有外设与软件, 是否已有统一系统要求]
    note: 价格与报价一律走人工,正文只引导咨询

  store_visit:
    name: 门店到访
    audiences: [附近潜在顾客, 路过客户, 老客户]
    default_stage: 决策
    visit_intent: true  # 到店意图:CTA 用 stages.决策.visit_intent
    core_conflict: 网上看参数不如上手摸一下,但顾客不知道去店里该验证什么
    angle: 给一个"到店只做三件事"的清单,让人带着任务来
    angle_variants:
      first_time: 写第一次到店该带什么、问什么
      returning: 写已有设备的升级验证
    fact_priority: [屏幕, 键盘和触控板, 接口, 尺寸与重量, 特色应用]
    reader_questions:
      - 去店里能看到什么,能不能现场试
      - 我带什么东西过去最有用
      - 到店会不会被推销
    must_not:
      - 价格与权益没有资料依据时不得写
      - 制造"仅限今日""最后几台"的紧迫感
      - 承诺店内一定有货
    ask_if_missing: [门店在售型号, 目标人群, 是否有到店活动的资料依据]

  new_launch:
    name: 新品首发
    audiences: [关注新品的用户, 老用户换代, 数码爱好者]
    default_stage: 了解
    core_conflict: 新品信息多,读者想知道"和以前比,变了什么、和我有关吗"
    angle: 只讲与目标人群有关的两三处变化,不罗列全部规格
    angle_variants:
      upgrader: 写和上一代比的差异(仅限资料里有的两代数据)
      newcomer: 写这一代适合谁、不适合谁
    fact_priority: [处理器, 屏幕, 操作系统, 特色应用, 电池, 接口, 尺寸与重量]
    reader_questions:
      - 新在哪里,值不值得换
      - 我这种用法能用上新功能吗
    must_not:
      - 虚构优惠、补贴、预约赠品、首发库存
      - 在资料没有上一代数据时写"提升了 X%"
      - 写"重新定义""颠覆"
    ask_if_missing: [目标型号, 对比的旧机型, 读者身份]

  festival:
    name: 节日营销
    audiences: [送礼人群, 家庭购机用户, 学生家长]
    default_stage: 决策
    core_conflict: 送人的电脑要"合适",而不是"最贵"
    angle: 以"送给谁、他要拿来做什么"开场,写合适的配置,而不是写促销
    angle_variants:
      gift_for_parents: 强调易用、护眼、好带、出问题好找人
      gift_for_student: 强调课程要求和接口
    fact_priority: [屏幕, 尺寸与重量, 操作系统, 包装清单, 键盘和触控板, 电池]
    reader_questions:
      - 送长辈和送孩子分别怎么选
      - 颜色、版本别买错
      - 礼盒或包装里有什么
    must_not:
      - 虚构节日优惠、补贴、赠品、限量款
      - 写"送礼首选""最有面子"
      - 承诺节前到货
    ask_if_missing: [送给谁, 对方的主要用途, 预算是否有硬上限]
    note: 预算只用于筛选候选,不写进文案

# 信息不足时的追问。scene.py 按缺失项取最多 3 个。
# 原则:少而准,每个问题都会改变内容方向;不问对写作没有影响的问题。
clarifying_questions:
  usage:
    ask: 主要拿来做什么?(上课、办公、剪视频、家里用…)
    changes: 决定切入点和事实优先级
  mobility:
    ask: 是不是经常带出门?
    changes: 决定是否把重量、电池、接口放在前面
  software:
    ask: 有没有一定要用的软件?
    changes: 决定是否强调操作系统版本和兼容边界
  audience:
    ask: 这是写给谁看的?(学生、职场人、家长…)
    changes: 决定语气和称呼
  platform:
    ask: 准备发在哪里?(公众号、小红书、朋友圈、门店海报)
    changes: 决定结构、字数、图片数量
  model:
    ask: 具体想写哪一款?
    changes: 决定检索对象;易混淆型号时必须追问
  budget:
    ask: 预算大概在什么范围?
    changes: 只用于筛选候选型号,不写进文案
    note: 宽泛需求(如只说"想买轻薄本")时才问

# 追问触发规则
clarify_rules:
  - 缺 platform 或缺 model,必须先追问,不生成。
  - 只说品类没说型号(如"轻薄本"),先问 usage、mobility,再给候选。
  - 型号落入易混淆对(D 14 与 D 16、D 16 与 D 16 SE、MateBook 14 鸿蒙版与酷睿 Ultra 版、Pro 与 Pro S),必须追问。
  - 一次最多问 3 个问题,按"对内容方向影响最大"排序。
  - 用户拒绝回答时,用"待确认字段"继续搭骨架,不擅自补全。

# 兜底场景:用户给的场景不在 8 类内时
fallback:
  name: 通用
  strategy: 取最接近的一类,沿用其 must_not;若都不接近,只写人群、任务、事实、限制四件事
  must_not_inherit: 全部 8 类 must_not 的并集
